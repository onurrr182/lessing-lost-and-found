<!DOCTYPE html>
<html lang="en">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lessinggymnasium - Search Lost Items</title>
    <style>
        :root { --dull-green: #a3b18a; --light-bg: #f8f9fa; --white: #ffffff; --text-dark: #333; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; background-color: var(--light-bg); color: var(--text-dark); }
        .top-nav { padding: 10px 20px; background-color: var(--white); font-size: 14px; font-weight: bold; display: flex; justify-content: space-between; align-items: center;}
        .top-nav a { color: blue; text-decoration: underline; }
        .lang-btn { background: var(--light-bg); border: 1px solid #ccc; padding: 5px 10px; border-radius: 5px; cursor: pointer; font-weight: bold; }
        header { background-color: var(--white); padding: 10px 20px 20px 20px; text-align: center; }
        .logo { max-width: 200px; height: auto; }
        .container { display: flex; max-width: 1200px; margin: 0 auto; padding: 20px; gap: 30px; }
        
        .sidebar { flex: 0 0 250px; background-color: var(--dull-green); padding: 25px; border-radius: 12px; color: var(--white); height: fit-content; }
        .sidebar h3 { margin-top: 0; border-bottom: 2px solid white; padding-bottom: 10px; }
        .sidebar label { display: block; margin-bottom: 15px; font-size: 16px; cursor: pointer; }
        .search-input { width: 100%; padding: 10px; margin-bottom: 20px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; font-family: inherit; }

        .items-grid { flex: 1; display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 20px; }
        
        .item-card { background: var(--white); border-radius: 10px; overflow: hidden; cursor: pointer; border: 2px solid #e0e0e0; display: flex; flex-direction: column; }
        .item-card:hover { transform: scale(1.03); border-color: var(--dull-green); }
        .item-image { width: 100%; height: 180px; object-fit: cover; background-color: #e9ecef; }
        .item-details { padding: 15px; }
        .item-details h4 { margin: 0 0 5px 0; color: var(--text-dark); font-size: 18px; }
        .desc-preview { margin: 5px 0 10px 0; font-size: 14px; color: #555; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
        .item-location { font-size: 13px; font-weight: bold; color: var(--dull-green); }

        /* Popup Modal */
        .modal-overlay { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.6); z-index: 1000; align-items: center; justify-content: center; }
        .modal-content { background: var(--white); width: 90%; max-width: 500px; border-radius: 12px; padding: 20px; position: relative; }
        .close-btn { position: absolute; top: 15px; right: 15px; font-size: 24px; cursor: pointer; border: none; background: none; }
        .modal-image { width: 100%; height: 250px; object-fit: cover; border-radius: 8px; margin-bottom: 15px;}
        .modal-title { margin: 0 0 10px 0; font-size: 22px; }
        .modal-desc { font-size: 16px; margin-bottom: 15px; line-height: 1.5; }
        .modal-loc { font-size: 14px; font-weight: bold; color: var(--dull-green); padding: 10px; background: var(--light-bg); border-radius: 6px; }
    </style>
</head>
<body>

<div class="top-nav">
    <div>
        |<span data-i18n="navText">found something? click</span> <a href="index.html" data-i18n="navLink">here</a>|
    </div>
    <button id="langToggle" class="lang-btn">🇩🇪 DE</button>
</div>

<header>
    <img src="lessing-logo.png" alt="Lessinggymnasium Logo" class="logo">
    <h1 data-i18n="title">Lost Items Database</h1>
</header>

<div class="container">
    <div class="sidebar">
        <input type="text" id="searchInput" class="search-input" data-i18n-ph="searchPh" placeholder="Search...">
        <h3 data-i18n="filterTitle">Categories</h3>
        <label><input type="checkbox" class="filter-cb" value="Electronics"> <span data-i18n="catElec">Electronics</span></label>
        <label><input type="checkbox" class="filter-cb" value="School Material"> <span data-i18n="catSchool">School Material</span></label>
        <label><input type="checkbox" class="filter-cb" value="Clothing/Accessories"> <span data-i18n="catCloth">Clothing/Accessories</span></label>
        <label><input type="checkbox" class="filter-cb" value="Other"> <span data-i18n="catOther">Other</span></label>
    </div>

    <div class="items-grid" id="itemsContainer">
        </div>
</div>

<div class="modal-overlay" id="itemModal" onclick="closeModal(event)">
    <div class="modal-content">
        <button class="close-btn" onclick="document.getElementById('itemModal').style.display='none'">&times;</button>
        <img id="modalImg" class="modal-image" src="" alt="Item">
        <h2 class="modal-title" id="modalTitle">Item Name</h2>
        <p class="modal-desc" id="modalDesc">Full description goes here.</p>
        <div class="modal-loc" id="modalLoc">Location</div>
    </div>
</div>

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

<script>
    // --- TRANSLATION LOGIC ---
    const dict = {
        en: {
            navText: "found something? click", navLink: "here", title: "Lost Items Database",
            filterTitle: "Categories", catElec: "Electronics", catSchool: "School Material",
            catCloth: "Clothing/Accessories", catOther: "Other", noItems: "No items found.", foundAt: "Found at: ",
            searchPh: "Search...", pickupAt: "Pick-up at: ", contact: "Contact: "
        },
        de: {
             navText: "Etwas gefunden? Klicke", navLink: "hier", title: "Datenbank für verlorene Gegenstände",
             filterTitle: "Kategorien", catElec: "Elektronik", catSchool: "Schulmaterial",
             catCloth: "Kleidung/Accessoires", catOther: "Sonstiges", noItems: "Keine Gegenstände gefunden.", foundAt: "Gefunden in: ",
             searchPh: "Suchen...", pickupAt: "Abholort: ", contact: "Kontakt: "
        }
    };

    let currentLang = localStorage.getItem('lessingLang') || 'en';
    const urlParams = new URLSearchParams(window.location.search);
    const langParam = urlParams.get('currentLang');
    if (langParam) {
        if (langParam.startsWith('de')) currentLang = 'de';
        else if (langParam.startsWith('en')) currentLang = 'en';
    }

    function setLanguage(lang) {
        currentLang = lang;
        localStorage.setItem('lessingLang', lang);
        document.getElementById('langToggle').innerText = lang === 'en' ? '🇩🇪 DE' : '🇬🇧 EN';

        document.querySelectorAll('[data-i18n]').forEach(el => {
            el.innerText = dict[lang][el.getAttribute('data-i18n')];
        });
        document.querySelectorAll('[data-i18n-ph]').forEach(el => {
            el.placeholder = dict[lang][el.getAttribute('data-i18n-ph')];
        });
        applyFilters(); // Re-render items so category text updates
    }

    document.getElementById('langToggle').addEventListener('click', () => {
        setLanguage(currentLang === 'en' ? 'de' : 'en');
    });

    // Helper to translate the category tags coming from the database
    function translateCategory(englishCat) {
        if(englishCat === "Electronics") return dict[currentLang].catElec;
        if(englishCat === "School Material") return dict[currentLang].catSchool;
        if(englishCat === "Clothing/Accessories") return dict[currentLang].catCloth;
        return dict[currentLang].catOther;
    }

    // --- FIREBASE LOGIC ---
    // PASTE YOUR FIREBASE CONFIG HERE:
const firebaseConfig = {
  apiKey: "AIzaSyABkqWYzqbu_q43i6ZPS3oUk8JL_CFQtDw",
  authDomain: "lessing-lost-found.firebaseapp.com",
  projectId: "lessing-lost-found",
  storageBucket: "lessing-lost-found.firebasestorage.app",
  messagingSenderId: "603044278775",
  appId: "1:603044278775:web:4da5343f07aa47453a7ef2"
};

    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();
    let allItems = []; 

    db.collection("lostItems").orderBy("timestamp", "desc").onSnapshot((snapshot) => {
        allItems = []; 
        snapshot.forEach((doc) => {
            let item = doc.data();
            item.id = doc.id; 
            allItems.push(item);
        });
        applyFilters(); 
    });

    function displayItems(itemsToShow) {
        const container = document.getElementById('itemsContainer');
        container.innerHTML = ''; 

        if(itemsToShow.length === 0) {
            container.innerHTML = `<p>${dict[currentLang].noItems}</p>`;
            return;
        }

        itemsToShow.forEach((item) => {
            const displayCat = translateCategory(item.category);
            const title = item.shortName ? item.shortName : displayCat;
            const locText = item.locationMain ? `${item.locationMain} ${item.locationDetails ? '('+item.locationDetails+')' : ''}` : item.location;
            
            const cardHTML = `
                <div class="item-card" onclick="openModal('${item.id}')">
                    <img class="item-image" src="${item.image}">
                    <div class="item-details">
                        <h4>${title}</h4>
                        <div class="desc-preview">${item.description}</div>
                        <div class="item-location">📍 ${locText}</div>
                    </div>
                </div>
            `;
            container.innerHTML += cardHTML;
        });
    }

    function openModal(itemId) {
        const item = allItems.find(i => i.id === itemId);
        const displayCat = translateCategory(item.category);
        const title = item.shortName ? `${item.shortName} (${displayCat})` : displayCat;
        const locText = item.locationMain ? `${item.locationMain} ${item.locationDetails ? '('+item.locationDetails+')' : ''}` : item.location;
        
        document.getElementById('modalImg').src = item.image;
        document.getElementById('modalTitle').innerText = title;
        document.getElementById('modalDesc').innerText = item.description;
        
        let locHTML = `${dict[currentLang].foundAt} ${locText}`;
        if(item.pickupLocation) locHTML += `<br>${dict[currentLang].pickupAt} ${item.pickupLocation}`;
        if(item.contactInfo) locHTML += `<br>${dict[currentLang].contact} ${item.contactInfo}`;
        
        document.getElementById('modalLoc').innerHTML = locHTML;
        document.getElementById('itemModal').style.display = 'flex';
    }

    function closeModal(event) {
        if (event.target.id === 'itemModal') {
            document.getElementById('itemModal').style.display = 'none';
        }
    }

    function applyFilters() {
        const checkboxes = document.querySelectorAll('.filter-cb');
        const checkedValues = Array.from(checkboxes).filter(cb => cb.checked).map(cb => cb.value);
        const searchText = document.getElementById('searchInput').value.toLowerCase();
        
        let filteredItems = allItems;
        
        if (checkedValues.length > 0) {
            filteredItems = filteredItems.filter(item => checkedValues.includes(item.category));
        }
        
        if (searchText.trim() !== "") {
            filteredItems = filteredItems.filter(item => {
                const titleMatch = item.shortName ? item.shortName.toLowerCase().includes(searchText) : false;
                const descMatch = item.description ? item.description.toLowerCase().includes(searchText) : false;
                return titleMatch || descMatch;
            });
        }
        
        displayItems(filteredItems);
    }

    checkboxes = document.querySelectorAll('.filter-cb');
    checkboxes.forEach(box => box.addEventListener('change', applyFilters));
    document.getElementById('searchInput').addEventListener('input', applyFilters);

    // Initialize Language on load
    setLanguage(currentLang);
</script>
</body>
</html>
