<!DOCTYPE html>
<html lang="en">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lessinggymnasium - Report Found Item</title>
    <style>
        :root { --dull-green: #a3b18a; --light-bg: #f8f9fa; --white: #ffffff; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; background-color: var(--light-bg); color: #333; }
        .top-nav { padding: 10px 20px; background-color: var(--white); font-size: 14px; font-weight: bold; display: flex; justify-content: space-between; align-items: center;}
        .top-nav a { color: blue; text-decoration: underline; }
        .lang-btn { background: var(--light-bg); border: 1px solid #ccc; padding: 5px 10px; border-radius: 5px; cursor: pointer; font-weight: bold; }
        header { background-color: var(--white); padding: 10px 20px 20px 20px; text-align: center; border-bottom: 3px solid var(--dull-green); }
        .logo { max-width: 200px; height: auto; }
        .container { display: flex; justify-content: center; padding: 20px; }
        .upload-section { background: var(--white); padding: 30px; border-radius: 8px; width: 100%; max-width: 500px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        input, select, textarea { width: 100%; padding: 12px; margin: 10px 0 20px 0; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; font-family: inherit; }
        button[type="submit"] { background-color: var(--dull-green); color: white; padding: 15px 20px; border: none; cursor: pointer; width: 100%; font-size: 16px; font-weight: bold; border-radius: 4px; }
        button[type="submit"]:hover { background-color: #8f9e77; }
    </style>
</head>
<body>

<div class="top-nav">
    <div>
        |<span data-i18n="navText">searching for something? click</span> <a href="search.html" data-i18n="navLink">here</a>|
    </div>
    <button id="langToggle" class="lang-btn">🇩🇪 DE</button>
</div>

<header>
    <img src="lessing-logo.png" alt="Lessinggymnasium Logo" class="logo">
    <h1 data-i18n="title">Report a Found Item</h1>
</header>

<div class="container">
    <section class="upload-section">
        <p data-i18n="subtitle">Help a fellow student out. Upload a picture and details of what you found. You will remain completely anonymous.</p>
        <form id="uploadForm">
            <label><strong data-i18n="lblImage">Upload Image:</strong></label>
            <input type="file" id="itemImage" accept="image/*" required>
            
            <label><strong data-i18n="lblCat">Category:</strong></label>
            <select id="itemCategory" required>
                <option value="" data-i18n="catDefault">Select Category</option>
                <option value="Electronics" data-i18n="catElec">Electronics</option>
                <option value="School Material" data-i18n="catSchool">School Material</option>
                <option value="Clothing/Accessories" data-i18n="catCloth">Clothing/Accessories</option>
                <option value="Other" data-i18n="catOther">Other</option>
            </select>
            
            <label><strong data-i18n="lblDesc">Description (Include a short name first!):</strong></label>
            <textarea id="itemDesc" rows="4" data-i18n-ph="phDesc" placeholder="Example: Blue Casio Calculator. Found it sitting on the back desk..." required></textarea>
            
            <label><strong data-i18n="lblLoc">Location Found:</strong></label>
            <input type="text" id="itemLocation" data-i18n-ph="phLoc" placeholder="e.g. Room 204 or Cafeteria" required>
            
            <button type="submit" id="submitBtn" data-i18n="btnSubmit">Post Anonymously</button>
        </form>
    </section>
</div>

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

<script>
    // --- TRANSLATION LOGIC ---
    const dict = {
        en: {
            navText: "searching for something? click", navLink: "here", title: "Report a Found Item",
            subtitle: "Help a fellow student out. Upload a picture and details of what you found. You will remain completely anonymous.",
            lblImage: "Upload Image:", lblCat: "Category:", catDefault: "Select Category",
            catElec: "Electronics", catSchool: "School Material", catCloth: "Clothing/Accessories", catOther: "Other",
            lblDesc: "Description (Include a short name first!):", phDesc: "Example: Blue Casio Calculator. Found it sitting on the back desk...",
            lblLoc: "Location Found:", phLoc: "e.g. Room 204 or Cafeteria", btnSubmit: "Post Anonymously", uploading: "Uploading to Cloud..."
        },
        de: {
            navText: "Suchst du etwas? Klicke", navLink: "hier", title: "Gefundenen Gegenstand melden",
            subtitle: "Hilf einem Mitschüler. Lade ein Bild und Details hoch. Du bleibst komplett anonym.",
            lblImage: "Bild hochladen:", lblCat: "Kategorie:", catDefault: "Kategorie auswählen",
            catElec: "Elektronik", catSchool: "Schulmaterial", catCloth: "Kleidung/Accessoires", catOther: "Sonstiges",
            lblDesc: "Beschreibung (Kurzer Name zuerst!):", phDesc: "Beispiel: Blauer Casio Taschenrechner. Lag auf dem hinteren Tisch...",
            lblLoc: "Fundort:", phLoc: "z.B. Raum 204 oder Mensa", btnSubmit: "Anonym posten", uploading: "Wird hochgeladen..."
        }
    };

    let currentLang = localStorage.getItem('lessingLang') || 'en';

    function setLanguage(lang) {
        currentLang = lang;
        localStorage.setItem('lessingLang', lang);
        document.getElementById('langToggle').innerText = lang === 'en' ? '🇩🇪 DE' : '🇬🇧 EN';

        // Translate standard text
        document.querySelectorAll('[data-i18n]').forEach(el => {
            el.innerText = dict[lang][el.getAttribute('data-i18n')];
        });
        // Translate placeholders
        document.querySelectorAll('[data-i18n-ph]').forEach(el => {
            el.placeholder = dict[lang][el.getAttribute('data-i18n-ph')];
        });
    }

    document.getElementById('langToggle').addEventListener('click', () => {
        setLanguage(currentLang === 'en' ? 'de' : 'en');
    });
    setLanguage(currentLang); // Run on load

    // --- FIREBASE LOGIC ---
    // PASTE YOUR FIREBASE CONFIG HERE:
const firebaseConfig = {
  apiKey: "AIzaSyABkqWYzqbu_q43i6ZPS3oUk8JL_CFQtDw",
  authDomain: "lessing-lost-found.firebaseapp.com",
  projectId: "lessing-lost-found",
  storageBucket: "lessing-lost-found.firebasestorage.app",
  messagingSenderId: "603044278775",
  appId: "1:603044278775:web:4da5343f07aa47453a7ef2"
};

    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    document.getElementById('uploadForm').addEventListener('submit', function(e) {
        e.preventDefault(); 
        const btn = document.getElementById('submitBtn');
        btn.innerText = dict[currentLang].uploading;
        btn.disabled = true;

        const fileInput = document.getElementById('itemImage');
        const reader = new FileReader();
        reader.onload = function(event) {
            db.collection("lostItems").add({
                image: event.target.result,
                category: document.getElementById('itemCategory').value,
                description: document.getElementById('itemDesc').value,
                location: document.getElementById('itemLocation').value,
                timestamp: firebase.firestore.FieldValue.serverTimestamp()
            }).then(() => {
                alert(currentLang === 'en' ? "Item saved!" : "Gespeichert!");
                window.location.href = "search.html";
            }).catch((error) => {
                console.error("Error: ", error);
                alert("Error uploading.");
                btn.innerText = dict[currentLang].btnSubmit;
                btn.disabled = false;
            });
        };
        reader.readAsDataURL(fileInput.files[0]);
    });
</script>
</body>
</html>
