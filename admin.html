<!DOCTYPE html>
<html lang="en">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Lost & Found</title>
    <style>
        body { font-family: sans-serif; background: #f8f9fa; padding: 20px; }
        .admin-container { max-width: 800px; margin: 0 auto; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .item-row { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #ccc; padding: 15px 0; }
        .item-info { flex: 1; }
        .delete-btn { background: red; color: white; border: none; padding: 10px 15px; border-radius: 5px; cursor: pointer; font-weight: bold; }
        .delete-btn:hover { background: darkred; }
        img { width: 50px; height: 50px; object-fit: cover; border-radius: 4px; margin-right: 15px; }
    </style>
</head>
<body>

<div class="admin-container">
    <h2>Admin Control Center</h2>
    <p><a href="search.html">← Back to Search Page</a></p>
    <div id="adminList"></div>
</div>

<script>
    function loadAdminItems() {
        let items = JSON.parse(localStorage.getItem('lessingItems')) || [];
        const container = document.getElementById('adminList');
        container.innerHTML = '';

        if(items.length === 0) {
            container.innerHTML = "<p>No items to manage.</p>";
            return;
        }

        items.forEach((item, index) => {
            container.innerHTML += `
                <div class="item-row">
                    <div style="display:flex; align-items:center;">
                        <img src="${item.image}" alt="item">
                        <div class="item-info">
                            <strong>${item.category}</strong> - ${item.location}<br>
                            <small>${item.description}</small>
                        </div>
                    </div>
                    <button class="delete-btn" onclick="deleteItem(${index})">Delete</button>
                </div>
            `;
        });
    }

    function deleteItem(index) {
        if(confirm("Are you sure you want to delete this item?")) {
            let items = JSON.parse(localStorage.getItem('lessingItems')) || [];
            items.splice(index, 1); // Removes the item from the list
            localStorage.setItem('lessingItems', JSON.stringify(items)); // Saves the updated list
            loadAdminItems(); // Reloads the page visually
        }
    }

    loadAdminItems();
</script>

</body>
</html>
