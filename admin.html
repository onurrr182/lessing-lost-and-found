<!DOCTYPE html>
<html lang="en">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Lost & Found</title>
    <style>
        :root { --dull-green: #a3b18a; --light-bg: #f8f9fa; --white: #ffffff; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: var(--light-bg); padding: 20px; margin: 0; color: #333; }
        .container { max-width: 800px; margin: 0 auto; background: var(--white); padding: 30px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        
        .header { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid var(--dull-green); padding-bottom: 10px; margin-bottom: 20px; }
        .header h2 { margin: 0; }
        
        /* Login Form Styles */
        #loginSection { max-width: 400px; margin: 40px auto; text-align: center; }
        input { width: 100%; padding: 12px; margin: 10px 0 20px 0; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; font-family: inherit; }
        button { background-color: var(--dull-green); color: white; padding: 12px 20px; border: none; cursor: pointer; width: 100%; font-size: 16px; font-weight: bold; border-radius: 4px; }
        button:hover { background-color: #8f9e77; }
        .btn-small { width: auto; padding: 8px 15px; font-size: 14px; }
        .error-msg { color: red; font-size: 14px; margin-bottom: 15px; display: none; }

        /* Dashboard Styles */
        #dashboardSection { display: none; }
        .item-row { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #eee; padding: 15px 0; }
        .item-info { flex: 1; margin-left: 15px; }
        .item-info h4 { margin: 0 0 5px 0; }
        .item-info p { margin: 0; font-size: 14px; color: #555; }
        .item-info .loc { color: var(--dull-green); font-weight: bold; font-size: 13px; margin-top: 5px; }
        .delete-btn { background: #dc3545; color: white; border: none; padding: 8px 15px; border-radius: 5px; cursor: pointer; font-weight: bold; width: auto; }
        .delete-btn:hover { background: #c82333; }
        .item-img { width: 60px; height: 60px; object-fit: cover; border-radius: 6px; border: 1px solid #ddd; }

        /* Tabs Styles */
        .tabs { display: flex; gap: 10px; margin-bottom: 20px; border-bottom: 1px solid #ddd; padding-bottom: 10px; }
        .tab-btn { background: #eee; color: #333; border: none; padding: 10px 20px; border-radius: 6px; cursor: pointer; font-weight: bold; width: auto; font-size: 14px; transition: background 0.2s; }
        .tab-btn.active { background: var(--dull-green); color: white; }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        
        /* Feedback Row Styles */
        .feedback-row { border-bottom: 1px solid #eee; padding: 15px 0; display: flex; justify-content: space-between; align-items: flex-start; }
        .feedback-info { flex: 1; }
        .feedback-info .badge { display: inline-block; padding: 3px 8px; border-radius: 4px; font-size: 12px; font-weight: bold; color: white; margin-bottom: 5px; }
        .badge.General { background: #007bff; }
        .badge.Suggestion { background: #ffc107; color: #333; }
        .badge.Bug { background: #dc3545; }
        .feedback-info p { margin: 5px 0; font-size: 14px; }
        .feedback-info .time { font-size: 12px; color: #888; }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h2>Admin Control Center</h2>
        <div id="authControls" style="display:none;">
            <button class="btn-small" onclick="logout()">Logout</button>
        </div>
    </div>
    
    <p style="margin-bottom: 20px;"><a href="search.html" style="color: blue;">← Back to Search Page</a></p>

    <!-- Login Section -->
    <div id="loginSection">
        <h3>Login Required</h3>
        <p>Please sign in to manage lost items.</p>
        <form id="loginForm">
            <div id="errorMsg" class="error-msg">Invalid email or password.</div>
            <input type="email" id="email" placeholder="Admin Email" required>
            <input type="password" id="password" placeholder="Password" required>
            <button type="submit">Sign In</button>
        </form>
    </div>

    <!-- Dashboard Section -->
    <div id="dashboardSection">
        <div class="tabs">
            <button class="tab-btn active" onclick="switchTab('itemsTab', this)">Lost Items</button>
            <button class="tab-btn" onclick="switchTab('feedbackTab', this)">User Feedback</button>
        </div>

        <div id="itemsTab" class="tab-content active">
            <div id="adminList">
                <p>Loading items...</p>
            </div>
        </div>

        <div id="feedbackTab" class="tab-content">
            <div id="feedbackList">
                <p>Loading feedback...</p>
            </div>
        </div>
    </div>
</div>

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

<script>
    // Firebase Config
    const firebaseConfig = {
      apiKey: "AIzaSyABkqWYzqbu_q43i6ZPS3oUk8JL_CFQtDw",
      authDomain: "lessing-lost-found.firebaseapp.com",
      projectId: "lessing-lost-found",
      storageBucket: "lessing-lost-found.firebasestorage.app",
      messagingSenderId: "603044278775",
      appId: "1:603044278775:web:4da5343f07aa47453a7ef2"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();
    const auth = firebase.auth();

    const loginSection = document.getElementById('loginSection');
    const dashboardSection = document.getElementById('dashboardSection');
    const authControls = document.getElementById('authControls');
    const errorMsg = document.getElementById('errorMsg');

    let itemsListener = null;
    let feedbackListener = null;

    // --- AUTHENTICATION LOGIC ---
    auth.onAuthStateChanged((user) => {
        if (user) {
            // User is signed in.
            loginSection.style.display = 'none';
            dashboardSection.style.display = 'block';
            authControls.style.display = 'block';
            switchTab('itemsTab', document.querySelector('.tab-btn.active'));
        } else {
            // No user is signed in.
            loginSection.style.display = 'block';
            dashboardSection.style.display = 'none';
            authControls.style.display = 'none';
            if (itemsListener) { itemsListener(); itemsListener = null; }
            if (feedbackListener) { feedbackListener(); feedbackListener = null; }
            document.getElementById('adminList').innerHTML = '<p>Loading items...</p>';
            document.getElementById('feedbackList').innerHTML = '<p>Loading feedback...</p>';
        }
    });

    document.getElementById('loginForm').addEventListener('submit', (e) => {
        e.preventDefault();
        const email = document.getElementById('email').value;
        const password = document.getElementById('password').value;
        
        auth.signInWithEmailAndPassword(email, password)
            .then(() => {
                errorMsg.style.display = 'none';
                document.getElementById('loginForm').reset();
            })
            .catch((error) => {
                errorMsg.innerText = error.message;
                errorMsg.style.display = 'block';
            });
    });

    function logout() {
        auth.signOut();
    }

    function switchTab(tabId, btn) {
        document.querySelectorAll('.tab-content').forEach(content => {
            content.classList.remove('active');
        });
        document.getElementById(tabId).classList.add('active');

        document.querySelectorAll('.tab-btn').forEach(button => {
            button.classList.remove('active');
        });
        btn.classList.add('active');

        if (tabId === 'itemsTab') {
            if (feedbackListener) { feedbackListener(); feedbackListener = null; }
            loadItems();
        } else if (tabId === 'feedbackTab') {
            if (itemsListener) { itemsListener(); itemsListener = null; }
            loadFeedback();
        }
    }

    // --- FIRESTORE LOGIC ---
    function loadItems() {
        if (itemsListener) return;
        const container = document.getElementById('adminList');
        
        itemsListener = db.collection("lostItems").orderBy("timestamp", "desc").onSnapshot((snapshot) => {
            container.innerHTML = '';
            
            if (snapshot.empty) {
                container.innerHTML = "<p>No items found in database.</p>";
                return;
            }

            snapshot.forEach((doc) => {
                const item = doc.data();
                const id = doc.id;
                
                const title = item.shortName ? `${item.shortName} (${item.category})` : item.category;
                const locText = item.locationMain ? `${item.locationMain} ${item.locationDetails ? '('+item.locationDetails+')' : ''}` : (item.location || 'Unknown Location');

                container.innerHTML += `
                    <div class="item-row">
                        <div style="display:flex; align-items:center; flex:1;">
                            <img src="${item.image}" alt="item" class="item-img">
                            <div class="item-info">
                                <h4>${title}</h4>
                                <p>${item.description}</p>
                                <div class="loc">📍 ${locText}</div>
                            </div>
                        </div>
                        <button class="delete-btn" onclick="deleteItem('${id}')">Delete</button>
                    </div>
                `;
            });
        }, (error) => {
            console.error("Error fetching items: ", error);
            container.innerHTML = `<p style="color:red;">Error loading items. Make sure you have proper database permissions.</p>`;
        });
    }

    function deleteItem(id) {
        if(confirm("Are you sure you want to permanently delete this item? This cannot be undone.")) {
            db.collection("lostItems").doc(id).delete()
            .then(() => {
                console.log("Document successfully deleted!");
            }).catch((error) => {
                console.error("Error removing document: ", error);
                alert("Error deleting item.");
            });
        }
    }

    function loadFeedback() {
        if (feedbackListener) return;
        const container = document.getElementById('feedbackList');
        
        feedbackListener = db.collection("feedback").orderBy("timestamp", "desc").onSnapshot((snapshot) => {
            container.innerHTML = '';
            
            if (snapshot.empty) {
                container.innerHTML = "<p>No feedback found.</p>";
                return;
            }

            snapshot.forEach((doc) => {
                const fb = doc.data();
                const id = doc.id;
                const dateStr = fb.timestamp ? new Date(fb.timestamp.seconds * 1000).toLocaleString() : 'Just now';
                
                container.innerHTML += `
                    <div class="feedback-row">
                        <div class="feedback-info">
                            <span class="badge ${fb.type}">${fb.type}</span>
                            <p>${fb.text}</p>
                            <span class="time">🕒 ${dateStr}</span>
                        </div>
                        <button class="delete-btn" onclick="deleteFeedback('${id}')">Delete</button>
                    </div>
                `;
            });
        }, (error) => {
            console.error("Error fetching feedback: ", error);
            container.innerHTML = `<p style="color:red;">Error loading feedback. Make sure you have proper database permissions.</p>`;
        });
    }

    function deleteFeedback(id) {
        if(confirm("Are you sure you want to permanently delete this feedback?")) {
            db.collection("feedback").doc(id).delete()
            .then(() => {
                console.log("Feedback deleted!");
            }).catch((error) => {
                console.error("Error removing feedback: ", error);
                alert("Error deleting feedback.");
            });
        }
    }
</script>

</body>
</html>
